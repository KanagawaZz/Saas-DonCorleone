# Produção: tudo no mesmo servidor (VPS) — site, painel, API, app do entregador e WhatsApp.
# Subir/atualizar:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Ver erros:        docker compose -f docker-compose.prod.yml --env-file .env.production logs -f web
# O Caddy recebe o público nas portas 80/443 e gera o certificado HTTPS sozinho.
name: doncorleone-prod

x-restart: &restart
  restart: unless-stopped

services:
  web:
    <<: *restart
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://doncorleone:${DB_PASSWORD:?Defina DB_PASSWORD}@db:5432/doncorleone
      EVOLUTION_API_URL: http://evolution-api:8080
      ALLOWED_HOSTS: ${SYSTEM_DOMAIN:?Defina SYSTEM_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Defina SITE_DOMAIN},https://www.${SITE_DOMAIN}
      SITE_PUBLIC_URL: https://${SITE_DOMAIN}
    volumes:
      - media:/srv/backend/media
    depends_on:
      db:
        condition: service_healthy

  # Servidor web: site compilado + repasse para o sistema + HTTPS automático
  caddy:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile.site
      args:
        VITE_API_URL: https://${SYSTEM_DOMAIN}/api/v1
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      SYSTEM_DOMAIN: ${SYSTEM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
      CADDY_EXTRA_GLOBAL: ${CADDY_EXTRA_GLOBAL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doncorleone
      POSTGRES_USER: doncorleone
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doncorleone -d doncorleone"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cópia diária do banco em ./backups (guarda 14 dias). Baixe de vez em quando para outro lugar.
  backup:
    <<: *restart
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U doncorleone doncorleone | gzip > /backups/doncorleone-$$(date +%F).sql.gz
          find /backups -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  evolution-api:
    <<: *restart
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY}
      LANGUAGE: pt-BR
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 30
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: doncorleone
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # O sistema só envia avisos: conversas e contatos dos clientes não são guardados
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy

  evolution-postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  media:
  # Certificados HTTPS: não apague, senão o Caddy pede novos (há limite por semana)
  caddy_data:
  caddy_config:
  evolution_instances:
  evolution_postgres:
