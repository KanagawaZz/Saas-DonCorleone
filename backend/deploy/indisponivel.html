<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E0B09">
  <title>Voltamos em instantes · Don Corleone</title>
  <!-- Servida pelo Caddy quando o sistema (Django) não responde: reinício, atualização ou falha -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #0E0B09; color: #F5EFE6;
           font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { width: 100%; max-width: 460px; background: #1A1512; border: 1px solid rgba(243, 235, 221, 0.14); border-radius: 16px; padding: 28px 24px; }
    .marca { color: #F7BA2A; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.75rem; }
    h1 { margin: 10px 0 12px; font-size: 1.4rem; line-height: 1.25; }
    p { margin: 0 0 10px; color: #D8CEBE; }
    button { margin-top: 18px; width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; background: #F7BA2A; color: #1A1200;
             font: inherit; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 14px; color: #9A8E7F; }
  </style>
</head>
<body>
  <main>
    <div class="marca">Don Corleone</div>
    <h1>Voltamos em instantes</h1>
    <p>O sistema está reiniciando ou passando por uma atualização rápida. Nenhum pedido registrado foi perdido.</p>
    <p>Esta página tenta de novo sozinha em 20 segundos.</p>
    <button type="button" onclick="location.reload()">Tentar agora</button>
    <small>Se continuar fora do ar por mais de alguns minutos, avise o suporte.</small>
  </main>
  <script>setTimeout(function () { location.reload(); }, 20000);</script>
</body>
</html>
