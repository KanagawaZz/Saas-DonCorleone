{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E0B09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Entregas DC">
  <title>{% block title %}Entregador{% endblock %} · Don Corleone</title>
  <link rel="icon" href="{% static 'painel/brasao.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'painel/brasao.svg' %}">
  {% block manifest %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'painel/painel.css' %}">
  <link rel="stylesheet" href="{% static 'painel/entregador.css' %}">
</head>
<body class="courier-app">
  {% if messages %}
    <div class="messages" role="status" aria-live="polite">
      {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  <main class="courier-main">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
